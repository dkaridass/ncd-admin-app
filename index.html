<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NCD La Pentecôte Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Inter', 'sans-serif'],
            serif: ['Inter', 'serif'],
            mono: ['Space Mono', 'JetBrains Mono', 'Fira Code', 'monospace'],
          },
          colors: {
            primary: {
              DEFAULT: '#0044FF', // action-primary
              light: '#3B82F6',
              dark: '#0033CC'
            },
            secondary: {
              DEFAULT: '#D81124', // action-danger
              light: '#EF4444',
            },
            surface: {
              DEFAULT: '#FFFFFF',
            },
            card: {
              DEFAULT: '#FFFFFF',
            },
            border: {
              DEFAULT: '#E2E8F0', // border-color
            },
            text: {
              primary: '#1E293B',
              secondary: '#64748B',
              muted: '#94A3B8',
            },
            sidebar: '#0F172A',
            success: '#10B981',
            canvas: '#F8FAFC',
          },
          boxShadow: {
            'admin': '0 1px 2px rgba(0, 0, 0, 0.05)',
            'input': '0 1px 2px 0 rgba(0, 0, 0, 0.03)',
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out forwards',
            'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            shake: {
              '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
              '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
              '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
              '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
            }
          },
          backgroundImage: {
            'gradient-open-heaven': 'linear-gradient(145deg, #030614 0%, #002570 50%, #005AE5 100%)',
            'gradient-spirit-fire': 'linear-gradient(135deg, #005AE5 0%, #8215E5 50%, #E3001B 100%)',
          }
        },
      },
    }
  </script>
  <style>
    /* Global Typography & Readability Overrides */
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-size: 14px;
      line-height: 1.5;
      color: #1E293B;
      background-color: #F8FAFC;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Inter', sans-serif;
      color: #0F172A;
    }

    table th {
      font-weight: 600;
      font-size: 0.875rem;
      color: #64748B;
      border-bottom: 2px solid #E2E8F0;
      padding: 0.5rem 0.75rem;
      text-align: left;
    }

    table td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #E2E8F0;
      font-size: 0.875rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
    }

    .badge-success {
      background: #D1FAE5;
      color: #065F46;
    }

    .badge-pending {
      background: #FEF3C7;
      color: #92400E;
    }

    .badge-danger {
      background: #FEE2E2;
      color: #991B1B;
    }



    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 10px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }

    /* Smooth theme transition */
    *,
    *::before,
    *::after {
      transition-property: background-color, border-color;
      transition-duration: 200ms;
      transition-timing-function: ease;
    }

    .animate-levitate {
      animation: levitate 6s ease-in-out infinite;
    }

    .animate-levitate-delayed {
      animation: levitate 6s ease-in-out 3s infinite;
    }

    .animate-fade-in {
      animation: fadeIn 0.6s ease-out forwards;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.5",
    "recharts": "https://aistudiocdn.com/recharts@^3.3.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^11.0.8"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-[#F8FAFC] text-[#1E293B] font-sans antialiased selection:bg-primary/20">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
