<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NCD La Pentecôte Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
            mono: ['Space Mono', 'JetBrains Mono', 'Fira Code', 'monospace'],
          },
          colors: {
            primary: {
              DEFAULT: '#0B132B', // Deep Royal Navy (Logo match)
              light: '#16234D',   // Lighter Navy
              dark: '#060A17',    // Deepest Navy
              accent: '#C5A059',  // Champagne Gold
            },
            secondary: {
              DEFAULT: '#C8102E', // Vibrant Crimson Red (Logo match)
              light: '#E61E3D',   // Lighter Crimson
              dim: '#F48E9D',     // Muted Crimson
            },
            gold: {
              DEFAULT: '#C5A059', // Refined Royal gold accent
              light: '#D4AF37',
              dim: '#9A7D46',
            },
            // Premium Dark Mode Tokens
            surface: {
              DEFAULT: '#F8FAFC', // Light: Slate 50
              dark: '#05050A',    // Dark: Bespoke Midnight
              glass: 'rgba(255, 255, 255, 0.7)',
              glassDark: 'rgba(5, 5, 10, 0.85)',
            },
            card: {
              DEFAULT: '#FFFFFF',
              hover: '#F1F5F9', // light hover
              dark: 'rgba(197, 160, 89, 0.03)', // Translucent gold tint for cards
              darkHover: 'rgba(197, 160, 89, 0.08)',
            },
            border: {
              DEFAULT: '#E2E8F0', // Light: Slate 200
              dark: 'rgba(255, 255, 255, 0.08)', // Barely there structure
              darkHighlight: 'rgba(255, 255, 255, 0.2)', // Hover states & active inputs
            },
            text: {
              primary: { DEFAULT: '#0F172A', dark: '#F8FAFC' },
              secondary: { DEFAULT: '#475569', dark: '#94A3B8' },
              muted: { DEFAULT: '#94A3B8', dark: '#475569' },
            },
            accent: {
              glow: 'rgba(212, 168, 67, 0.3)',
              dangerGlow: 'rgba(220, 38, 38, 0.15)',
            }
          },
          boxShadow: {
            'premium': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)', // Stronger depth for login card
            'soft': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
            'input': '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
            'glow-gold': '0 0 15px rgba(212, 168, 67, 0.3)',
            'glow-danger': '0 0 15px rgba(220, 38, 38, 0.15)',
            'glow-primary': '0 0 15px rgba(37, 99, 235, 0.3)',
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out forwards',
            'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            shake: {
              '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
              '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
              '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
              '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
            }
          }
        },
      },
    }
  </script>
  <style>
    /* Global Typography & Readability Overrides */
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-size: 15px;
      /* Slightly larger baseline than default 14px */
      line-height: var(--tw-prose-body, 1.6);
      color: #0F172A;
      /* Slate 900 for Light Mode */
    }

    .dark body {
      color: #F8FAFC;
      /* Slate 50 for Dark Mode */
      /* Add an incredibly subtle text shadow to text in dark mode to combat native browser thinning */
      text-shadow: 0 0.5px 0.5px rgba(0, 0, 0, 0.4);
    }

    .glass-effect {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .dark .glass-effect {
      background: rgba(11, 17, 32, 0.85);
      border-color: rgba(255, 255, 255, 0.06) !important;
    }

    .sidebar-glass {
      background: rgba(30, 27, 75, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 10px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }

    /* Smooth theme transition */
    *,
    *::before,
    *::after {
      transition-property: background-color, border-color;
      transition-duration: 200ms;
      transition-timing-function: ease;
    }

    .animate-levitate {
      animation: levitate 6s ease-in-out infinite;
    }

    .animate-levitate-delayed {
      animation: levitate 6s ease-in-out 3s infinite;
    }

    .animate-fade-in {
      animation: fadeIn 0.6s ease-out forwards;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.5",
    "recharts": "https://aistudiocdn.com/recharts@^3.3.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^11.0.8"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body
  class="bg-[#F8F9FA] dark:bg-surface-dark text-primary dark:text-slate-100 font-sans antialiased selection:bg-secondary-light selection:text-primary transition-colors duration-200">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
